name: gitpulse

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitpulse
      POSTGRES_USER: gitpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse -d gitpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  elasticsearch:
    image: elasticsearch:8.11.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms768m -Xmx768m
      xpack.security.enabled: "false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.32.11
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-embedding-model:
    image: ollama/ollama:0.32.11
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "mxbai-embed-large"]
    depends_on:
      ollama:
        condition: service_healthy

  ollama-chat-model:
    image: ollama/ollama:0.32.11
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5-coder:3b"]
    depends_on:
      ollama-embedding-model:
        condition: service_completed_successfully

  db-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command:
      - /app/packages/db/node_modules/.bin/prisma
      - db
      - push
      - --schema
      - packages/db/prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://gitpulse:${POSTGRES_PASSWORD}@postgres:5432/gitpulse
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gitpulse:${POSTGRES_PASSWORD}@postgres:5432/gitpulse
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      EMBEDDING_API_KEY: ollama
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      EMBEDDING_MODEL: mxbai-embed-large
      EMBEDDING_DIMENSIONS: 1024
      LLM_API_KEY: ollama
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5-coder:3b
      PORT: 3001
      NODE_ENV: production
      WEB_URL: https://${GITPULSE_HOST}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama-embedding-model:
        condition: service_completed_successfully
      ollama-chat-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      GITPULSE_HOST: ${GITPULSE_HOST:?Set GITPULSE_HOST in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  es_data:
  ollama_data:
  caddy_data:
  caddy_config:
